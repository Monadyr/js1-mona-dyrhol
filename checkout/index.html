<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Square Eyes | Checkout </title>
  <link rel="stylesheet" href="../css/checkout.css">
  <link rel="stylesheet" href="../css/global.css">
  <script type="module" src="../js/checkout.js" defer></script>
  <script type="module" src="https://kit.fontawesome.com/8d67182890.js" crossorigin="anonymous"></script>
</head>
<body>
  <header class="header">
    <span class="logo">SQUARE EYES</span>
    <nav class="nav-bar">
        <a href="../index.html"><i class="fa-solid fa-house fa-2xl" id="home-el"></i></a>  
        <a href="/checkout/cart.html"><i class="fa-solid fa-cart-shopping fa-2xl" id="cart-el"><span id="cartCount">0</span></i></a>    </nav>
  </header>

  <main>
    <h1>Checkout</h1>
    <section class="cart-list"></section>

    <fieldset id="shippingInfo">
      <legend>Shipping Address</legend>

        <label for="fullname">Full Name</label>
        
        <input type="text" name="fullname" id="fullname" autocomplete="name" placeholder="John Doe" required>

        <label for="address">Street Address</label>
        <input type="text" id="address" name="address" autocomplete="address-level1" placeholder="main-street 123" required>
      <div>
        <label for="city">City</label>
        <input type="text" name="city" id="city" autocomplete="address-level2" placeholder="oslo" required>

        <label for="zip">Postal Code</label>
        <input type="text" name="zip" id="zip" autocomplete="postal-code" placeholder="1000" required>
      </div>
        <label for="country">Country</label>
        <input type="text" name="country" id="country" autocomplete="country-name" placeholder="norway" required>
      
    </fieldset>

    <section class="Summary">
      <h2>Summary</h2>
      <p>Subtotal: <span id="subtotal">0</span></p>
      <p>Shipping: <span id="shipping">0</span></p>
      <p>Total: <span id="total">0</span></p>
    </section>

    <button class="buy-btn">BUY</button>
  </main>

  <footer>
    <ul>
    <li><a href="../terms-condition.html">Terms and condition</a></li>
    <li><a href="../privacy.html">Privacy Policy</a></li>
    </ul>
    <p>&copy; <span id="year"> </span> SQUARE EYES. <br> All rights reserved.</p>
  </footer>
</body>
</html>
