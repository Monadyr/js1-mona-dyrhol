<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Square Eyes | Checkout </title>
  <link rel="stylesheet" href="../css/checkout.css">
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/loading-page.css">
  <script type="module" src="../js/checkout.js"></script>
  <script type="module" src="https://kit.fontawesome.com/8d67182890.js" crossorigin="anonymous"></script>
</head>
<body>
  <header class="header">
    <span class="logo">SQUARE EYES</span>
    <nav class="nav-bar">
        <a href="../index.html"><i class="fa-solid fa-house fa-2xl" id="home-el"></i></a>  
        <a href="cart.html"><i class="fa-solid fa-cart-shopping fa-2xl" id="cart-el"><span id="cartCount">0</span></i></a>    </nav>
  </header>

  <main>
    <h1>Checkout</h1>
    <section class="cart-list">
      <h2>Your shopping cart: </h2>
    </section>

    <form id="checkout-form">
    <fieldset id="shippingInfo">
      <legend>Shipping Address</legend>
<div>
        <label for="fullname">Full Name</label>
        
        <input type="text" name="fullname" id="fullname" autocomplete="name" placeholder="Type full name" >

        <label for="address">Street Address</label>
        <input type="text" id="address" name="address" autocomplete="address-line1" placeholder="Type street address" >

        <label for="city">City</label>
        <input type="text" name="city" id="city" autocomplete="address-level2" placeholder="Type city" >

        <label for="zip">Postal Code</label>
        <input type="text" name="zip" id="zip" autocomplete="postal-code" placeholder="Type postal code" >

        <label for="country">Country</label>
        <select id="country">
          <option value="">Select Country</option>
          <option value="">Norway</option>
          <option value="">Sweden</option>
          <option value="">Denmark</option>
          <option value="">Finland</option>
          <option value="">Europe</option>
          <option value="">Other</option>
        </select>
        <input type="text" name="country" id="country" autocomplete="country-name" placeholder="Type country" >
</div>
        <section class="summary">
          <h3>Summary:</h3>
          <p>Subtotal: <span id="subtotal">0</span></p>
          <p>Shipping: <span id="shipping">0</span></p>
          <p>Total: <span id="total">0</span></p>
        </section>

        <button type="submit" class="buy-btn">CONFIRM</button>
    </fieldset>
    </form>
    
  </main>

  <footer>
    <ul>
    <li><a href="../terms-condition.html">Terms and condition</a></li>
    <li><a href="../privacy.html">Privacy Policy</a></li>
    </ul>
    <p>&copy; <span id="year"> </span> SQUARE EYES. <br> All rights reserved.</p>
  </footer>
</body>
</html>
