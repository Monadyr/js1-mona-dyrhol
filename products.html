<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Square Eyes | All Movies </title>
  <link rel="stylesheet" href="css/products.css">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/movie-card.css">
  <link rel="stylesheet" href="css/loading-page.css">
  <script type="module" src="js/products.js" defer></script>
  <script type="module" src="https://kit.fontawesome.com/8d67182890.js" crossorigin="anonymous"></script>
</head>
<body>
  <header class="header">
    <span class="logo">SQUARE EYES</span>
    <nav class="nav-bar">
        <a href="index.html"><i class="fa-solid fa-house fa-2xl" id="home-el"></i></a>  
        <a href="checkout/cart.html"><i class="fa-solid fa-cart-shopping fa-2xl" id="cart-el"><span id="cartCount">0</span></i></a>    </nav>
  </header>

  <main>

    <h1>Browse all movies</h1>

    <button id="filterBtn">FILTER</button>
    <div id="filterMenu" class="filter-menu">

      <div id="checkboxEl" class="checkbox-el"></div>

      <div class="sort-el">
        <label for="sortReleased">Released</label>
        <select id="sortReleased">
          <option value="released-new">New</option>
          <option value="released-old">Old</option>
        </select>

        <label for="sortRating">Rating</label>
        <select id="sortRating">
          <option value="rating-high">High</option>
          <option value="rating-low">Low</option>
        </select>
      </div>
      
    </div>

   <section class="movie-section"></section>

  </main>

  <footer>
    <ul>
    <li><a href="terms-condition.html">Terms and condition</a></li>
    <li><a href="privacy.html">Privacy Policy</a></li>
    </ul>
    <p>&copy; <span id="year"> </span> SQUARE EYES. <br> All rights reserved.</p>
  </footer>
</body>
</html>
